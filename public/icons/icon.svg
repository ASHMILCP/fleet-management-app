<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="truckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />

  <!-- Truck Icon Symbol -->
  <g filter="url(#shadow)" fill="none" stroke="url(#truckGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" transform="translate(64, 96)">
    <!-- Cargo Box -->
    <rect x="16" y="56" width="220" height="176" rx="18" fill="rgba(255,255,255,0.12)" stroke="url(#truckGrad)" stroke-width="26" />
    <!-- Cab Front -->
    <path d="M 236 104 L 304 104 L 352 168 L 352 232 L 236 232 Z" fill="rgba(255,255,255,0.12)" stroke="url(#truckGrad)" stroke-width="26" />
    <!-- Cab Window -->
    <path d="M 248 120 L 292 120 L 328 168 L 248 168 Z" fill="rgba(255,255,255,0.28)" stroke="url(#truckGrad)" stroke-width="16" />
    <!-- Rear Wheel -->
    <circle cx="92" cy="246" r="38" fill="#1e1b4b" stroke="url(#truckGrad)" stroke-width="24" />
    <circle cx="92" cy="246" r="14" fill="#ffffff" />
    <!-- Front Wheel -->
    <circle cx="292" cy="246" r="38" fill="#1e1b4b" stroke="url(#truckGrad)" stroke-width="24" />
    <circle cx="292" cy="246" r="14" fill="#ffffff" />
    <!-- Speed motion line -->
    <path d="M -12 110 L -36 110" stroke="rgba(255,255,255,0.6)" stroke-width="18" stroke-linecap="round" />
    <path d="M -8 160 L -48 160" stroke="rgba(255,255,255,0.6)" stroke-width="18" stroke-linecap="round" />
  </g>
</svg>
